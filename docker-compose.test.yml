version: '3.9'
services:  
  postgres:
    image: postgres:16    
    container_name: online_store_test_db    
    environment:
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpassword      
        POSTGRES_DB: online_store_test  
    ports:      
      - "5433:5432"
    healthcheck:   
      test: ["CMD-SHELL", "pg_isready -U testuser -d online_store_test"]
      interval: 5s
      timeout: 5s      
      retries: 10  
  redis:
    image: redis:7-alpine    
    container_name: online_store_test_redis    
    ports:      
      - "6380:6379"    
    healthcheck:   
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s      
      timeout: 5s     
      retries: 10